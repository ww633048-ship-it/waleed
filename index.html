<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waliy Hub | لوحة تحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #1a0a14; color: #fce7f3; }
        .login-box { background: #2d0a1e; border: 1px solid #ec4899; box-shadow: 0 0 30px rgba(236, 72, 153, 0.3); }
        .btn-pink { background: linear-gradient(135deg, #ec4899, #be185d); transition: all 0.3s; }
        .btn-pink:hover { background: linear-gradient(135deg, #f472b6, #db2777); }
        .card { background: #2d0a1e; border: 1px solid #be185d; border-radius: 16px; padding: 1.5rem; }
        .input-field { background: #1a0a14; border: 1px solid #ec4899; color: #fce7f3; padding: 0.75rem; border-radius: 12px; width: 100%; }
        .input-field:focus { outline: none; border-color: #f472b6; box-shadow: 0 0 10px rgba(236, 72, 153, 0.5); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="login-screen" class="min-h-screen flex items-center justify-center">
        <div class="login-box p-8 rounded-2xl w-full max-w-md text-center space-y-5">
            <h2 class="text-3xl font-bold text-pink-300">💖 Waliy Hub</h2>
            <p class="text-pink-400/70 text-sm">لوحة تحكم الأدمن</p>
            <input type="text" id="login-username" placeholder="👤 اسم المستخدم" class="input-field text-center">
            <input type="password" id="login-password" placeholder="🔒 كلمة المرور" class="input-field text-center">
            <button onclick="doLogin()" class="btn-pink w-full text-white font-bold py-3 rounded-xl transition">دخول</button>
            <p id="login-error" class="text-red-400 text-sm hidden">❌ اسم المستخدم أو كلمة المرور خطأ</p>
        </div>
    </div>

    <div id="admin-panel" class="max-w-7xl mx-auto space-y-6 hidden">
        <div class="card flex justify-between items-center flex-wrap gap-4">
            <h1 class="text-2xl font-bold text-pink-300">💖 لوحة تحكم Waliy Hub</h1>
            <button onclick="logout()" class="bg-red-600/30 hover:bg-red-600 text-white px-4 py-2 rounded-xl text-sm">تسجيل خروج 🚪</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="card space-y-4">
                <h3 class="text-lg font-bold text-pink-400">✨ إنشاء سكربت</h3>
                <input type="text" id="script-name" placeholder="اسم السكربت" class="input-field">
                <input type="text" id="target-username" placeholder="يوزرنيم محدد (اختياري)" class="input-field">
                <input type="text" id="kick-message" placeholder="رسالة الطرد" class="input-field">
                <input type="text" id="expiry-duration" placeholder="المدة: 7d, 1h, 1y (اختياري)" class="input-field">
                <textarea id="lua-content" rows="6" placeholder="كود Lua هنا..." class="input-field" dir="ltr"></textarea>
                <button onclick="createScript()" class="btn-pink w-full text-white font-bold py-3 rounded-xl">💾 حفظ</button>
            </div>

            <div class="card space-y-4">
                <h3 class="text-lg font-bold text-pink-300">📂 السكربتات</h3>
                <div id="scripts-list" class="space-y-3 max-h-[500px] overflow-y-auto pr-1"></div>
            </div>
        </div>
    </div>

    <script>
        async function api(url, options = {}) {
            const res = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json' } });
            if (res.status === 401) { logout(); return; }
            return res.json();
        }

        async function doLogin() {
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            const data = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username: u, password: p }) });
            if (data?.success) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadScripts();
            } else document.getElementById('login-error').classList.remove('hidden');
        }

        function logout() { fetch('/api/auth/logout', { method: 'POST' }).then(() => location.reload()); }

        async function createScript() {
            const body = {
                name: document.getElementById('script-name').value.trim(),
                luaContent: document.getElementById('lua-content').value.trim(),
                targetUsername: document.getElementById('target-username').value.trim() || null,
                kickMessage: document.getElementById('kick-message').value.trim() || 'تم طردك من السكربت',
                expiryDuration: document.getElementById('expiry-duration').value.trim() || null
            };
            if (!body.name || !body.luaContent) return alert('املأ الحقول!');
            await api('/api/scripts', { method: 'POST', body: JSON.stringify(body) });
            loadScripts();
            ['script-name', 'target-username', 'kick-message', 'expiry-duration', 'lua-content'].forEach(id => document.getElementById(id).value = '');
        }

        async function loadScripts() {
            const scripts = await api('/api/scripts');
            const container = document.getElementById('scripts-list');
            container.innerHTML = (scripts || []).map(s => `
                <div class="p-3 bg-[#1a0a14]/50 rounded-xl border border-pink-700/30">
                    <div class="flex justify-between items-center">
                        <span class="font-bold">${s.name}</span>
                        <span class="text-xs ${s.enabled ? 'text-green-400' : 'text-red-400'}">${s.enabled ? 'شغال' : 'طافي'}</span>
                    </div>
                    ${s.targetUsername ? `<p class="text-[10px] text-pink-400">🎯 ${s.targetUsername}</p>` : ''}
                    <div class="grid grid-cols-3 gap-1 mt-2">
                        <button onclick="toggleScript(${s.id}, ${!s.enabled})" class="bg-green-600 text-[10px] p-1 rounded">تشغيل/إيقاف</button>
                        <button onclick="getLoadstring(${s.id})" class="bg-indigo-600 text-[10px] p-1 rounded">رابط</button>
                        <button onclick="deleteScript(${s.id})" class="bg-red-600 text-[10px] p-1 rounded">🗑️</button>
                    </div>
                </div>`).join('');
        }

        async function toggleScript(id, status) {
            await api(`/api/scripts/${id}`, { method: 'PATCH', body: JSON.stringify({ enabled: status }) });
            loadScripts();
        }

        async function deleteScript(id) {
            if (confirm('حذف السكربت؟')) { await api(`/api/scripts/${id}`, { method: 'DELETE' }); loadScripts(); }
        }

        async function getLoadstring(id) {
            const data = await api(`/api/scripts/${id}/loadstring`);
            if (data) {
                await navigator.clipboard.writeText(data.loadstring);
                alert('✅ تم نسخ الـ Loadstring!');
            }
        }

        (async () => {
            const me = await api('/api/auth/me');
            if (me?.loggedIn) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadScripts();
            }
        })();
    </script>
</body>
</html>
